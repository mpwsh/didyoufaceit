[project]
name = "didyoufaceit"
version = "0.2.0"
description = "Find FACEIT matches played against a specific opponent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.3.1",
  "httpx>=0.28.1",
  "rich>=14.3.3",
  "flask>=3.0.0",
  "flask-cors>=4.0.0",
]

[project.scripts]
faceit-finder = "faceit_finder.cli:main"
faceit-finder-web = "faceit_finder.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/didyoufaceit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

