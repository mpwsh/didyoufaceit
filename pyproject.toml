[project]
name = "didyoufaceit"
version = "0.3.1"
requires-python = ">=3.12"
description = "CS2 FACEIT match history & matchroom analyzer"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "gunicorn>=23,<24",
  "httpx>=0.28,<1",
  "asyncpg>=0.30,<1",
  "python-dotenv>=1,<2",
  "click>=8.1,<9",
  "rich>=13,<14",
]

[project.scripts]
didyoufaceit-web = "didyoufaceit.server:run"
didyoufaceit = "didyoufaceit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/didyoufaceit"]

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
