<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ownage.finder</title>

<!-- Tailwind v4 CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Alpine.js v3 -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand:   { DEFAULT: '#ff5500', dim: '#cc4400' },
          surface: { DEFAULT: '#141414', alt: '#1a1a1a' },
          border:  { DEFAULT: '#2a2a2a', strong: '#3a3a3a' },
          win:     '#22c55e',
          lose:    '#ef4444',
          muted:   '#666666',
          blue:    '#60a5fa',
          gold:    '#f59e0b',
        },
        fontFamily: {
          display: ['"Bebas Neue"', 'sans-serif'],
          mono:    ['"DM Mono"', 'monospace'],
          sans:    ['"DM Sans"', 'sans-serif'],
        },
      }
    }
  }
</script>

<style>
  /* grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,85,0,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,85,0,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* indeterminate progress bar */
  @keyframes indeterminate {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(420%); }
  }
  .progress-indeterminate { animation: indeterminate 1.4s ease-in-out infinite; }

  /* match card slide-in */
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card-enter { animation: fadeSlide .22s ease both; }

  /* loading pulse */
  @keyframes blink { 0%,100% { opacity:.25; } 50% { opacity:.8; } }
  .blink { animation: blink 1.4s ease-in-out infinite; }
</style>
</head>

<body class="bg-[#0d0d0d] text-[#e8e8e8] font-sans min-h-screen overflow-x-hidden"
      x-data="app()"
      x-init="init()">

<div class="relative z-10 max-w-4xl mx-auto px-6">

  <!-- ── HEADER ── -->
  <header class="py-12 border-b border-border mb-12">
    <div class="font-display text-[clamp(48px,8vw,80px)] tracking-widest leading-none">
      OWNAGE<span class="text-brand">.</span>FINDER
    </div>
    <div class="font-mono text-[11px] text-muted tracking-[3px] uppercase mt-2">
      CS2 match history — find who owned who
    </div>
  </header>

  <!-- ── SEARCH CARD ── -->
  <div class="bg-surface border border-border p-8 mb-10">
    <div class="grid grid-cols-[1fr_auto_1fr] gap-4 items-end mb-5">

      <!-- Your nick -->
      <div>
        <label class="block font-mono text-[10px] tracking-[2px] uppercase text-muted mb-2">
          Your Nickname
        </label>
        <!-- PenguinUI text-input pattern -->
        <input
          type="text"
          x-model="youInput"
          @keydown.enter="doSearch()"
          placeholder="your_nick"
          autocomplete="off" spellcheck="false"
          class="w-full bg-[#0d0d0d] border border-border text-[#e8e8e8] font-mono text-[15px] px-4 py-3 outline-none transition-colors focus:border-brand placeholder-[#333]"
        >
      </div>

      <!-- VS badge -->
      <div class="font-display text-[28px] text-brand text-center tracking-widest pb-3">VS</div>

      <!-- Opponent nick -->
      <div>
        <label class="block font-mono text-[10px] tracking-[2px] uppercase text-muted mb-2">
          Opponent Nickname
        </label>
        <input
          type="text"
          x-model="oppInput"
          @keydown.enter="doSearch()"
          placeholder="their_nick"
          autocomplete="off" spellcheck="false"
          class="w-full bg-[#0d0d0d] border border-border text-[#e8e8e8] font-mono text-[15px] px-4 py-3 outline-none transition-colors focus:border-brand placeholder-[#333]"
        >
      </div>
    </div>

    <!-- PenguinUI button pattern -->
    <button
      @click="doSearch()"
      :disabled="searching"
      class="w-full bg-brand text-white font-display text-xl tracking-[3px] py-4 transition-opacity hover:opacity-85 active:scale-[.99] disabled:opacity-40 disabled:cursor-not-allowed"
    >
      <span x-show="!searching">SEARCH MATCHES</span>
      <span x-show="searching" class="flex items-center justify-center gap-3">
        <!-- PenguinUI spinner pattern -->
        <svg class="animate-spin size-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        SEARCHING…
      </span>
    </button>

    <!-- Cache notice — PenguinUI badge pattern -->
    <div x-show="cacheNotice" x-transition class="flex items-center gap-2 mt-4 font-mono text-[11px] tracking-[1px] text-muted">
      <span
        class="inline-block size-2 rounded-full flex-shrink-0"
        :class="cacheNotice?.hit ? 'bg-win shadow-[0_0_6px_#22c55e]' : 'bg-brand shadow-[0_0_6px_#ff5500]'"
      ></span>
      <span x-text="cacheNotice?.msg"></span>
    </div>
  </div>

  <!-- ── PROGRESS AREA (PenguinUI progress pattern) ── -->
  <div x-show="searching" x-transition class="mb-8">
    <div class="flex justify-between items-end mb-2">
      <span class="font-mono text-[11px] tracking-[1.5px] uppercase text-muted" x-text="statusMsg">Connecting…</span>
      <span class="font-mono text-[11px] text-brand" x-text="foundCount > 0 ? foundCount + ' found' : ''"></span>
    </div>

    <!-- progress track -->
    <div class="h-[3px] bg-border overflow-hidden" role="progressbar" :aria-valuenow="progressPct" aria-valuemin="0" aria-valuemax="100">
      <div
        class="h-full bg-brand transition-[width] duration-300"
        :class="progressTotal === 0 ? 'progress-indeterminate w-[30%]' : ''"
        :style="progressTotal > 0 ? `width: ${progressPct}%` : ''"
      ></div>
    </div>

    <div class="flex gap-6 mt-2 font-mono text-[11px] text-muted">
      <span x-text="progressTotal > 0 ? progressChecked.toLocaleString() + ' / ' + progressTotal.toLocaleString() + ' checked' : 'scanning…'"></span>
    </div>
  </div>

  <!-- ── ERROR (PenguinUI alert pattern) ── -->
  <div
    x-show="errorMsg"
    x-transition
    class="flex gap-3 items-start bg-[#1a0a0a] border border-[#4a1a1a] text-lose font-mono text-[13px] p-4 mb-6"
    role="alert"
  >
    <svg class="size-4 mt-[1px] flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
    <span x-text="errorMsg"></span>
  </div>

  <!-- ── RESULTS ── -->
  <div x-show="showResults" x-transition>

    <!-- SCOREBOARD -->
    <div class="grid grid-cols-[1fr_auto_1fr] border border-border overflow-hidden mb-3">
      <!-- You -->
      <div class="text-center p-7 transition-colors" :class="youWins > oppWins ? 'bg-[#0a1a0a]' : oppWins > youWins ? 'bg-[#160a0a]' : 'bg-surface'">
        <div class="font-display text-[clamp(18px,2.5vw,26px)] tracking-widest mb-1 break-all" x-text="you"></div>
        <div class="font-display text-[clamp(44px,7vw,68px)] leading-none"
             :class="youWins > oppWins ? 'text-win' : oppWins > youWins ? 'text-lose' : 'text-brand'"
             x-text="youWins"></div>
        <div class="font-mono text-[10px] tracking-[2px] uppercase text-muted mt-1" x-text="youWins === 1 ? 'win' : 'wins'"></div>
      </div>

      <!-- Middle -->
      <div class="flex flex-col items-center justify-center gap-1.5 px-4 py-5 bg-surface-alt border-x border-border min-w-[76px]">
        <div class="font-display text-base text-muted tracking-widest">VS</div>
        <div class="text-center">
          <div class="font-display text-xl text-[#e8e8e8] tracking-wide" x-text="enemies.length"></div>
          <div class="font-mono text-[10px] text-muted">matches</div>
        </div>
        <template x-if="draws > 0">
          <div class="text-center">
            <div class="font-display text-xl text-[#e8e8e8]" x-text="draws"></div>
            <div class="font-mono text-[10px] text-muted">draws</div>
          </div>
        </template>
      </div>

      <!-- Opponent -->
      <div class="text-center p-7 transition-colors" :class="oppWins > youWins ? 'bg-[#0a1a0a]' : youWins > oppWins ? 'bg-[#160a0a]' : 'bg-surface'">
        <div class="font-display text-[clamp(18px,2.5vw,26px)] tracking-widest mb-1 break-all" x-text="opp"></div>
        <div class="font-display text-[clamp(44px,7vw,68px)] leading-none"
             :class="oppWins > youWins ? 'text-win' : youWins > oppWins ? 'text-lose' : 'text-brand'"
             x-text="oppWins"></div>
        <div class="font-mono text-[10px] tracking-[2px] uppercase text-muted mt-1" x-text="oppWins === 1 ? 'win' : 'wins'"></div>
      </div>
    </div>

    <!-- TEAMMATE BAR -->
    <div class="bg-surface border border-border border-t-0 px-6 py-3.5 flex flex-wrap items-center gap-x-5 gap-y-2 mb-10">
      <span class="font-mono text-[10px] tracking-[2px] uppercase text-muted flex-shrink-0">as teammates</span>

      <template x-if="teammates.length > 0">
        <div class="flex flex-wrap items-center gap-x-5 gap-y-2">

          <!-- W / L / D -->
          <div class="flex gap-3 font-mono text-[12px]">
            <span class="text-win"  x-text="tmWins + 'W'"></span>
            <span class="text-lose" x-text="tmLosses + 'L'"></span>
            <template x-if="tmDraws > 0">
              <span class="text-muted" x-text="tmDraws + 'D'"></span>
            </template>
          </div>

          <!-- divider -->
          <div class="w-px self-stretch bg-border flex-shrink-0"></div>

          <!-- global winrate -->
          <span class="font-mono text-[11px]"
                :class="tmWr >= 55 ? 'text-win' : tmWr <= 40 ? 'text-lose' : 'text-[#e8e8e8]'"
                x-text="tmWr + '% wr'"></span>

          <!-- best map -->
          <template x-if="bestMap">
            <div class="flex items-center gap-1.5 font-mono text-[11px]">
              <div class="w-px self-stretch bg-border flex-shrink-0"></div>
              <span class="text-muted">best</span>
              <span class="font-display tracking-wide text-win text-[13px]" x-text="bestMap"></span>
              <span class="text-muted" x-text="'(' + Math.round(filteredMapWins[bestMap].w / (filteredMapWins[bestMap].w + filteredMapWins[bestMap].l) * 100) + '%\u00a0·\u00a0' + filteredMapWins[bestMap].w + 'W\u00a0' + filteredMapWins[bestMap].l + 'L)'"></span>
            </div>
          </template>

          <!-- worst map -->
          <template x-if="worstMap">
            <div class="flex items-center gap-1.5 font-mono text-[11px]">
              <div class="w-px self-stretch bg-border flex-shrink-0"></div>
              <span class="text-muted">worst</span>
              <span class="font-display tracking-wide text-lose text-[13px]" x-text="worstMap"></span>
              <span class="text-muted" x-text="'(' + Math.round(filteredMapWins[worstMap].w / (filteredMapWins[worstMap].w + filteredMapWins[worstMap].l) * 100) + '%\u00a0·\u00a0' + filteredMapWins[worstMap].w + 'W\u00a0' + filteredMapWins[worstMap].l + 'L)'"></span>
            </div>
          </template>

        </div>
      </template>

      <template x-if="teammates.length === 0 && !searching">
        <span class="font-mono text-[12px] text-muted">no matches found</span>
      </template>

      <template x-if="teammates.length > 0">
        <span class="ml-auto font-mono text-[11px] text-blue bg-[#0a1a2a] border border-[#1a3a5a] px-2.5 py-0.5 rounded-sm"
              x-text="filteredTeammates.length + (filterMap !== 'all' || filterYear !== 'all' ? ' / ' + teammates.length : '') + ' matches'"></span>
      </template>
    </div>

    <!-- ── FILTERS ── -->
    <template x-if="showResults">
      <div class="mb-8 flex flex-col gap-3">

        <!-- Map filter -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-mono text-[10px] tracking-[2px] uppercase text-muted w-8 flex-shrink-0">MAP</span>
          <template x-for="map in availableMaps" :key="map">
            <button
              @click="filterMap = map"
              :class="filterMap === map
                ? 'bg-brand text-white border-brand'
                : 'bg-surface border-border text-muted hover:border-brand hover:text-[#e8e8e8]'"
              class="font-mono text-[10px] tracking-[1px] uppercase border px-2.5 py-1 transition-colors"
              x-text="map === 'all' ? 'ALL' : map.replace('de_', '')"
            ></button>
          </template>
        </div>

        <!-- Year filter -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-mono text-[10px] tracking-[2px] uppercase text-muted w-8 flex-shrink-0">YEAR</span>
          <template x-for="year in availableYears" :key="year">
            <button
              @click="filterYear = String(year)"
              :class="filterYear === String(year)
                ? 'bg-brand text-white border-brand'
                : 'bg-surface border-border text-muted hover:border-brand hover:text-[#e8e8e8]'"
              class="font-mono text-[10px] tracking-[1px] uppercase border px-2.5 py-1 transition-colors"
              x-text="year === 'all' ? 'ALL' : year"
            ></button>
          </template>
        </div>

      </div>
    </template>

    <!-- ENEMIES SECTION -->
    <template x-if="enemies.length > 0 || !searching">
      <div>
        <div class="flex items-center gap-4 mb-4 mt-10">
          <div class="font-display text-[22px] tracking-[3px]">ENEMIES</div>
          <!-- PenguinUI badge -->
          <span class="font-mono text-[11px] bg-[#2a0a0a] text-lose border border-[#4a1a1a] px-2.5 py-0.5 rounded-sm"
                x-text="filteredEnemies.length + (filterMap !== 'all' || filterYear !== 'all' ? ' / ' + enemies.length : '') + ' matches'"></span>
          <div class="flex-1 h-px bg-border"></div>
        </div>
        <div class="flex flex-col gap-2">
          <template x-for="m in filteredEnemies" :key="m.match_id">
            <div x-html="matchCard(m)" class="card-enter contents"></div>
          </template>
          <template x-if="enemies.length === 0 && !searching">
            <div class="font-mono text-[13px] text-muted py-8 text-center tracking-wide">No enemy matches found</div>
          </template>
        </div>
        <div x-show="searching && enemies.length > 0" class="font-mono text-[11px] text-border tracking-[2px] text-center py-3.5 blink">
          loading more…
        </div>
      </div>
    </template>

    <!-- TEAMMATES SECTION -->
    <template x-if="teammates.length > 0 || !searching">
      <div class="mt-10">
        <div class="flex items-center gap-4 mb-4">
          <div class="font-display text-[22px] tracking-[3px]">TEAMMATES</div>
          <span class="font-mono text-[11px] bg-[#0a1a2a] text-blue border border-[#1a3a5a] px-2.5 py-0.5 rounded-sm"
                x-text="filteredTeammates.length + (filterMap !== 'all' || filterYear !== 'all' ? ' / ' + teammates.length : '') + ' matches'"></span>
          <div class="flex-1 h-px bg-border"></div>
        </div>
        <div class="flex flex-col gap-2">
          <template x-for="m in filteredTeammates" :key="m.match_id">
            <div x-html="matchCard(m)" class="card-enter contents"></div>
          </template>
          <template x-if="teammates.length === 0 && !searching">
            <div class="font-mono text-[13px] text-muted py-8 text-center tracking-wide">No teammate matches found</div>
          </template>
        </div>
        <div x-show="searching && teammates.length > 0" class="font-mono text-[11px] text-border tracking-[2px] text-center py-3.5 blink">
          loading more…
        </div>
      </div>
    </template>


    <!-- BEST LINEUPS SECTION -->
    <template x-if="bestLineups.length > 0">
      <div class="mt-10 mb-6">
        <div class="flex items-center gap-4 mb-4">
          <div class="font-display text-[22px] tracking-[3px]">BEST LINEUPS</div>
          <span class="font-mono text-[11px] bg-[#1a1200] text-gold border border-[#3a2800] px-2.5 py-0.5 rounded-sm">
            5-man · all time
          </span>
          <div class="flex-1 h-px bg-border"></div>
        </div>
        <div class="flex flex-col gap-2">
          <template x-for="(lu, i) in bestLineups" :key="lu.roster.join('|')">
            <div class="bg-surface border border-border px-5 py-3.5 grid grid-cols-[24px_1fr_auto] gap-4 items-center">
              <!-- rank -->
              <div class="font-display text-[18px] text-muted leading-none" x-text="i + 1"></div>
              <!-- roster -->
              <div class="font-mono text-[11px] flex flex-wrap gap-x-2 gap-y-1 min-w-0">
                <template x-for="nick in lu.roster" :key="nick">
                  <span
                    :class="nick === you ? 'text-brand' : 'text-[#e8e8e8]'"
                    x-text="nick"
                  ></span>
                </template>
              </div>
              <!-- stats -->
              <div class="text-right flex-shrink-0 flex items-center gap-4">
                <div class="font-mono text-[11px] flex gap-2">
                  <span class="text-win"  x-text="lu.w + 'W'"></span>
                  <span class="text-lose" x-text="lu.l + 'L'"></span>
                  <template x-if="lu.d > 0">
                    <span class="text-muted" x-text="lu.d + 'D'"></span>
                  </template>
                </div>
                <div
                  class="font-display text-[20px] leading-none w-14 text-right"
                  :class="(lu.w/(lu.w+lu.l||1)*100) >= 55 ? 'text-win' : (lu.w/(lu.w+lu.l||1)*100) <= 40 ? 'text-lose' : 'text-[#e8e8e8]'"
                  x-text="(lu.w + lu.l) > 0 ? Math.round(lu.w / (lu.w + lu.l) * 100) + '%' : 'N/A'"
                ></div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

  </div><!-- /results -->

  <footer class="border-t border-border mt-20 py-6 text-center font-mono text-[11px] text-[#333] tracking-wide">
    OWNAGE.FINDER — FACEIT Data API v4 &nbsp;·&nbsp; CS2
  </footer>

</div><!-- /container -->

<script>
// ── pure helpers (no DOM, no Alpine deps) ─────────────────────────────────────

function scoreInfo(scoreStr) {
  if (!scoreStr || scoreStr === 'N/A') return { label: 'N/A', cls: 'text-[#888]', win: null };
  const [a, b] = scoreStr.split('/').map(s => parseInt(s.trim(), 10));
  if (isNaN(a) || isNaN(b)) return { label: scoreStr, cls: 'text-[#888]', win: null };
  if (a > b) return { label: scoreStr, cls: 'text-win',  win: true };
  if (a < b) return { label: scoreStr, cls: 'text-lose', win: false };
  return { label: scoreStr, cls: 'text-[#888]', win: null };
}

function fmtDate(unix) {
  if (!unix) return ['—', ''];
  const d = new Date(unix * 1000);
  return [
    d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' }),
    d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }),
  ];
}

function rosterHtml(teams, yourTeam, you, opp) {
  const yours = (teams[yourTeam] || []).map(n => {
    if (n === you) return `<span class="text-brand">${n}</span>`;
    if (n === opp) return `<span class="text-blue">${n}</span>`;
    return n;
  }).join(', ');
  const theirs = Object.entries(teams)
    .filter(([t]) => t !== yourTeam)
    .flatMap(([, r]) => r.map(n => n === opp ? `<span class="text-blue">${n}</span>` : n))
    .join(', ');
  return theirs
    ? `${yours}&nbsp;&nbsp;<span class="text-border">|</span>&nbsp;&nbsp;${theirs}`
    : yours;
}

function tournamentBadgeHtml(m) {
  if (!m.competition_type || m.competition_type === 'matchmaking') return '';
  const label = m.competition_name || m.competition_type;
  return `<span class="font-mono text-[9px] tracking-[1px] uppercase text-gold bg-[#1a1200] border border-[#3a2800] px-1.5 py-0.5 rounded-sm truncate max-w-[200px]" title="${label}">🏆 ${label}</span>`;
}

// ── Alpine app ────────────────────────────────────────────────────────────────

function app() {
  return {
    // inputs
    youInput: '',
    oppInput: '',

    // search state
    searching:       false,
    statusMsg:       'Connecting…',
    progressChecked: 0,
    progressTotal:   0,
    foundCount:      0,

    // results
    you:       '',
    opp:       '',
    enemies:   [],
    teammates: [],
    errorMsg:  '',
    cacheNotice: null,

    // filters
    filterMap:  'all',
    filterYear: 'all',

    // computed
    get showResults() { return this.enemies.length > 0 || this.teammates.length > 0; },
    get availableMaps() {
      const maps = new Set([...this.enemies, ...this.teammates].map(m => m.map).filter(Boolean));
      return ['all', ...Array.from(maps).sort()];
    },
    get availableYears() {
      const years = new Set([...this.enemies, ...this.teammates]
        .map(m => m.started_at ? new Date(m.started_at * 1000).getFullYear() : null).filter(Boolean));
      return ['all', ...Array.from(years).sort((a, b) => b - a)];
    },
    _passes(m) {
      if (this.filterMap  !== 'all' && m.map !== this.filterMap) return false;
      if (this.filterYear !== 'all' && (!m.started_at || new Date(m.started_at * 1000).getFullYear() !== parseInt(this.filterYear))) return false;
      return true;
    },
    get filteredEnemies()   { return [...this.enemies].filter(m => this._passes(m)).sort((a,b) => b.started_at - a.started_at); },
    get filteredTeammates() { return [...this.teammates].filter(m => this._passes(m)).sort((a,b) => b.started_at - a.started_at); },
    get youWins()   { return this.filteredEnemies.filter(m => scoreInfo(m.score).win === true).length; },
    get oppWins()   { return this.filteredEnemies.filter(m => scoreInfo(m.score).win === false).length; },
    get draws()     { return this.filteredEnemies.filter(m => scoreInfo(m.score).win === null).length; },
    get tmWins()    { return this.filteredTeammates.filter(m => scoreInfo(m.score).win === true).length; },
    get tmLosses()  { return this.filteredTeammates.filter(m => scoreInfo(m.score).win === false).length; },
    get tmDraws()   { return this.filteredTeammates.filter(m => scoreInfo(m.score).win === null).length; },
    get tmWr() {
      const t = this.tmWins + this.tmLosses;
      return t > 0 ? Math.round((this.tmWins / t) * 100) : 0;
    },
    get progressPct() {
      return this.progressTotal > 0 ? Math.min(100, Math.round((this.progressChecked / this.progressTotal) * 100)) : 0;
    },
    get filteredMapWins() {
      const mw = {};
      for (const m of this.filteredTeammates) {
        const key = m.map || 'unknown';
        if (!mw[key]) mw[key] = { w: 0, l: 0 };
        const { win } = scoreInfo(m.score);
        if (win === true) mw[key].w++; else if (win === false) mw[key].l++;
      }
      return mw;
    },
    get bestMap() {
      let best = null, bestWr = -1;
      for (const [map, { w, l }] of Object.entries(this.filteredMapWins)) {
        if (w + l < 2) continue;
        const wr = w / (w + l);
        if (wr > bestWr) { best = map; bestWr = wr; }
      }
      return best;
    },
    get worstMap() {
      let worst = null, worstWr = 2;
      for (const [map, { w, l }] of Object.entries(this.filteredMapWins)) {
        if (w + l < 2 || map === this.bestMap) continue;
        const wr = w / (w + l);
        if (wr < worstWr) { worst = map; worstWr = wr; }
      }
      return worst;
    },
    get bestLineups() {
      const counts = {};
      for (const m of this.teammates) {
        // Group by UUID roster for stability across nickname changes
        const ids = ((m.teams_ids || m.teams)[m.your_team] || []).slice().sort();
        const key = ids.join('|');
        // Display roster uses current nicknames from m.teams
        const displayRoster = (m.teams[m.your_team] || []);
        if (!counts[key]) counts[key] = { roster: displayRoster, w: 0, l: 0, d: 0 };
        const { win } = scoreInfo(m.score);
        if (win === true) counts[key].w++; else if (win === false) counts[key].l++; else counts[key].d++;
      }
      return Object.values(counts)
        .filter(c => c.w + c.l + c.d >= 2)
        .sort((a, b) => {
          const wrA = (a.w + a.l) > 0 ? a.w / (a.w + a.l) : 0;
          const wrB = (b.w + b.l) > 0 ? b.w / (b.w + b.l) : 0;
          return wrB !== wrA ? wrB - wrA : (b.w + b.l + b.d) - (a.w + a.l + a.d);
        })
        .slice(0, 5);
    },
    init() {
      const p = new URLSearchParams(window.location.search);
      const a = p.get('a')?.trim();
      const b = p.get('b')?.trim();
      if (a) this.youInput = a;
      if (b) this.oppInput = b;
      if (a && b) this.$nextTick(() => this.doSearch());
    },

    // match card — returns HTML string for x-html
    matchCard(m) {
      const { label, cls, win } = scoreInfo(m.score);
      const resultText  = win === true ? 'win' : win === false ? 'loss' : 'draw';
      const resultColor = win === true ? 'text-win' : win === false ? 'text-lose' : 'text-muted';
      const [d, t] = fmtDate(m.started_at);
      return `
        <a href="${m.faceit_url || '#'}" target="_blank" rel="noopener"
           class="bg-surface border border-border px-5 py-3.5 grid grid-cols-[72px_1fr_auto] gap-4 items-center transition-colors hover:border-brand no-underline text-[#e8e8e8] card-enter block">
          <div class="font-mono text-[11px] text-muted leading-relaxed">${d}<br>${t}</div>
          <div class="flex flex-col gap-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-display text-lg tracking-widest">${m.map || 'UNKNOWN'}</span>
              ${tournamentBadgeHtml(m)}
            </div>
            <div class="font-mono text-[11px] text-muted truncate">${rosterHtml(m.teams, m.your_team, this.you, this.opp)}</div>
          </div>
          <div class="text-right flex-shrink-0">
            <div class="font-display text-[22px] tracking-widest leading-none ${cls}">${label}</div>
            <div class="font-mono text-[10px] tracking-[1px] uppercase mt-0.5 ${resultColor}">${resultText}</div>
          </div>
        </a>`;
    },

    // SSE search
    _es: null,

    doSearch() {
      const you = this.youInput.trim();
      const opp = this.oppInput.trim();
      if (!you || !opp) { alert('Please enter both nicknames.'); return; }

      if (this._es) { this._es.close(); this._es = null; }

      // reset
      this.errorMsg      = '';
      this.cacheNotice   = null;
      this.enemies       = [];
      this.teammates     = [];
      this.filterMap     = 'all';
      this.filterYear    = 'all';

      this.you           = you;
      this.opp           = opp;
      this.searching     = true;

      // make the URL shareable
      const url = new URL(window.location);
      url.searchParams.set('a', you);
      url.searchParams.set('b', opp);
      window.history.replaceState({}, '', url);
      this.statusMsg     = 'Connecting…';
      this.progressChecked = 0;
      this.progressTotal   = 0;
      this.foundCount      = 0;

      const es = new EventSource(
        `/api/search?you=${encodeURIComponent(you)}&opponent=${encodeURIComponent(opp)}`
      );
      this._es = es;

      es.onmessage = (e) => {
        let ev;
        try { ev = JSON.parse(e.data); } catch { return; }

        switch (ev.type) {
          case 'status':
            this.statusMsg = ev.msg;
            break;

          case 'progress':
            if (ev.total)    this.progressTotal   = ev.total;
            if (ev.checked)  this.progressChecked = ev.checked;
            if (ev.found > 0) {
              this.foundCount = ev.found;
              this.statusMsg  = `Found ${ev.found} match${ev.found !== 1 ? 'es' : ''} so far…`;
            }
            break;

          case 'match':
            this.foundCount++;
            this._ingest(ev);
            break;

          case 'done':
            this.searching = false;
            this._finalize(ev);
            es.close(); this._es = null;
            break;

          case 'error':
            this.searching = false;
            this.errorMsg  = ev.msg;
            es.close(); this._es = null;
            break;
        }
      };

      es.onerror = () => {
        if (es.readyState === EventSource.CLOSED) return;
        this.searching = false;
        this.errorMsg  = 'Connection lost. Please try again.';
        es.close(); this._es = null;
      };
    },

    _ingest(m) {
      if (m.same_team) {
        this.teammates.push(m);
      } else {
        this.enemies.push(m);
      }
    },

    _finalize(ev) {
      if (!this.enemies.length && !this.teammates.length) {
        this.errorMsg = `No matches found between ${this.you} and ${this.opp}.`;
        return;
      }
      const hit = ev.cached;
      const msg = hit
        ? `loaded from cache · ${ev.total_checked.toLocaleString()} matches indexed`
        : `scan complete · ${ev.total_checked.toLocaleString()} indexed · ${ev.new_fetched.toLocaleString()} fetched from api`;
      this.cacheNotice = { hit, msg };
    },
  };
}
</script>
