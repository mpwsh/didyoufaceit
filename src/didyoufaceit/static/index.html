<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>didyoufaceit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.8/dist/cdn.min.js"
    ></script>
    <script src="/static/app.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: { DEFAULT: "#ff5500", dim: "#cc4400" },
              surface: { DEFAULT: "#141414", alt: "#1a1a1a" },
              border: { DEFAULT: "#2a2a2a", strong: "#3a3a3a" },
              win: "#22c55e",
              lose: "#ef4444",
              muted: "#666666",
              blue: "#60a5fa",
              gold: "#f59e0b",
            },
            fontFamily: {
              display: ['"Bebas Neue"', "sans-serif"],
              mono: ['"DM Mono"', "monospace"],
              sans: ['"DM Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 85, 0, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 85, 0, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes indeterminate {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(420%);
        }
      }
      .progress-indeterminate {
        animation: indeterminate 1.4s ease-in-out infinite;
      }
      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card-enter {
        animation: fadeSlide 0.22s ease both;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 0.8;
        }
      }
      .blink {
        animation: blink 1.4s ease-in-out infinite;
      }
    </style>
  </head>
  <body
    class="bg-[#0d0d0d] text-[#e8e8e8] font-sans min-h-screen overflow-x-hidden"
    x-data="app()"
    x-init="init()"
  >
    <div class="relative z-10 max-w-4xl mx-auto px-6">
      <!-- ── COLLAPSED HEADER (results visible OR searching) ── -->
      <div
        x-show="hasAnyResults || searching || mrSearching || banScanning"
        x-transition
        class="flex items-center justify-between py-4 border-b border-border mb-8"
      >
        <a
          href="/"
          @click.prevent="newSearch()"
          class="font-display text-2xl tracking-widest leading-none cursor-pointer hover:opacity-80 transition-opacity"
        >
          DIDYOU<span class="text-brand">FACEIT</span>
        </a>
        <div class="flex gap-2">
          <button
            x-show="searching || mrSearching || banScanning"
            @click="cancelSearch()"
            class="font-mono text-[11px] tracking-[2px] uppercase text-muted border border-border px-4 py-2 transition-colors hover:border-lose hover:text-lose"
          >
            STOP
          </button>
          <button
            @click="newSearch()"
            class="font-mono text-[11px] tracking-[2px] uppercase text-muted border border-border px-4 py-2 transition-colors hover:border-brand hover:text-[#e8e8e8]"
          >
            NEW SEARCH
          </button>
        </div>
      </div>

      <!-- ── FULL HEADER (no results, not searching) ── -->
      <header
        x-show="!hasAnyResults && !searching && !mrSearching && !banScanning"
        x-transition
        class="py-12 border-b border-border mb-12"
      >
        <a href="/" class="block">
          <div
            class="font-display text-[clamp(48px,8vw,80px)] tracking-widest leading-none"
          >
            DIDYOU<span class="text-brand">FACEIT</span>
          </div>
        </a>
        <div
          class="font-mono text-[11px] text-muted tracking-[3px] uppercase mt-2"
        >
          List matches with someone else
        </div>
      </header>

      <!-- ── SEARCH CARD (hidden when searching or showing results) ── -->
      <div
        x-show="!showResults && !mrDone && !searching && !mrSearching && !showBanResults && !banScanning"
        x-transition
        class="bg-surface border border-border p-8 mb-10"
      >
        <div class="grid grid-cols-[1fr_auto_1fr] gap-4 items-end mb-5">
          <div>
            <label
              class="block font-mono text-[10px] tracking-[2px] uppercase text-muted mb-2"
              >Your Nickname</label
            >
            <input
              type="text"
              x-model="youInput"
              @keyup.enter="doSearch()"
              placeholder="your_nick"
              autocomplete="off"
              spellcheck="false"
              class="w-full bg-[#0d0d0d] border border-border text-[#e8e8e8] font-mono text-[15px] px-4 py-3 outline-none transition-colors focus:border-brand placeholder-[#333]"
            />
          </div>
          <div
            class="font-display text-[28px] text-brand text-center tracking-widest pb-3"
          >
            VS
          </div>
          <div>
            <label
              class="block font-mono text-[10px] tracking-[2px] uppercase text-muted mb-2"
              >Opponent Nickname</label
            >
            <input
              type="text"
              x-model="oppInput"
              @keyup.enter="doSearch()"
              placeholder="their_nick"
              autocomplete="off"
              spellcheck="false"
              class="w-full bg-[#0d0d0d] border border-border text-[#e8e8e8] font-mono text-[15px] px-4 py-3 outline-none transition-colors focus:border-brand placeholder-[#333]"
            />
          </div>
        </div>
        <button
          @click="doSearch()"
          :disabled="searching || mrSearching || banScanning"
          class="w-full bg-brand text-white font-display text-xl tracking-[3px] py-4 transition-opacity hover:opacity-85 active:scale-[.99] disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-3"
        >
          <svg
            x-show="searching"
            class="animate-spin size-5 text-white flex-shrink-0"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            />
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            />
          </svg>
          <span x-text="searching ? 'SEARCHING…' : 'SEARCH'"></span>
        </button>

        <!-- Matchroom divider -->
        <div class="flex items-center gap-4 mt-6">
          <div class="flex-1 h-px bg-border"></div>
          <span
            class="font-mono text-[10px] tracking-[2px] uppercase text-muted"
            >or paste a matchroom url</span
          >
          <div class="flex-1 h-px bg-border"></div>
        </div>
        <div class="mt-4">
          <input
            type="text"
            x-model="matchroomInput"
            @keyup.enter="doSearch()"
            placeholder="faceit.com/en/cs2/room/1-xxxx… or just the match id"
            autocomplete="off"
            spellcheck="false"
            class="w-full bg-[#0d0d0d] border border-border text-[#e8e8e8] font-mono text-[13px] px-4 py-3 outline-none transition-colors focus:border-brand placeholder-[#333]"
          />
        </div>

        <!-- Ban scan divider -->
        <div class="flex items-center gap-4 mt-6">
          <div class="flex-1 h-px bg-border"></div>
          <span
            class="font-mono text-[10px] tracking-[2px] uppercase text-muted"
            >or find banned opponents</span
          >
          <div class="flex-1 h-px bg-border"></div>
        </div>
        <div class="mt-4 flex gap-3">
          <input
            type="text"
            x-model="banScanInput"
            @keyup.enter="doBanScan()"
            placeholder="your nickname"
            autocomplete="off"
            spellcheck="false"
            class="flex-1 bg-[#0d0d0d] border border-border text-[#e8e8e8] font-mono text-[13px] px-4 py-3 outline-none transition-colors focus:border-lose placeholder-[#333]"
          />
          <button
            @click="doBanScan()"
            :disabled="banScanning"
            class="bg-[#2a0a0a] text-lose border border-[#4a1a1a] font-display text-lg tracking-[2px] px-6 py-3 transition-all hover:bg-[#3a0a0a] hover:border-lose disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2"
          >
            <svg
              x-show="banScanning"
              class="animate-spin size-4 text-lose flex-shrink-0"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              />
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
              />
            </svg>
            <span x-text="banScanning ? 'SCANNING…' : 'BAN SCAN'"></span>
          </button>
        </div>

        <div
          x-show="cacheNotice"
          x-transition
          class="flex items-center gap-2 mt-4 font-mono text-[11px] tracking-[1px] text-muted"
        >
          <span
            class="inline-block size-2 rounded-full flex-shrink-0"
            :class="cacheNotice?.hit ? 'bg-win shadow-[0_0_6px_#22c55e]' : 'bg-brand shadow-[0_0_6px_#ff5500]'"
          ></span>
          <span x-text="cacheNotice?.msg"></span>
        </div>
      </div>

      <!-- ── PROGRESS (player search) ── -->
      <div x-show="searching" x-transition class="mb-8">
        <div class="flex justify-between items-end mb-2">
          <span
            class="font-mono text-[11px] tracking-[1.5px] uppercase text-muted"
            x-text="statusMsg"
            >Connecting…</span
          >
          <span
            class="font-mono text-[11px] text-brand"
            x-text="foundCount > 0 ? foundCount + ' found' : ''"
          ></span>
        </div>
        <div
          class="h-[3px] bg-border overflow-hidden"
          role="progressbar"
          :aria-valuenow="progressPct"
        >
          <div
            class="h-full bg-brand transition-[width] duration-300"
            :class="progressTotal === 0 ? 'progress-indeterminate w-[30%]' : ''"
            :style="progressTotal > 0 ? `width: ${progressPct}%` : ''"
          ></div>
        </div>
        <div class="flex gap-6 mt-2 font-mono text-[11px] text-muted">
          <span
            x-text="progressTotal > 0 ? progressChecked.toLocaleString() + ' / ' + progressTotal.toLocaleString() + ' checked' : 'scanning…'"
          ></span>
        </div>
      </div>

      <!-- ── ERROR ── -->
      <div
        x-show="errorMsg"
        x-transition
        class="flex gap-3 items-start bg-[#1a0a0a] border border-[#4a1a1a] text-lose font-mono text-[13px] p-4 mb-6"
        role="alert"
      >
        <svg
          class="size-4 mt-[1px] flex-shrink-0"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd"
          />
        </svg>
        <span x-text="errorMsg"></span>
      </div>

      <!-- ══════════════════════════════════════════════════════════════════════
           BAN SCAN RESULTS
           ══════════════════════════════════════════════════════════════════════ -->
      <div x-show="showBanResults || banScanning" x-transition>
        <!-- Ban scan error -->
        <div
          x-show="banScanError"
          x-transition
          class="flex gap-3 items-start bg-[#1a0a0a] border border-[#4a1a1a] text-lose font-mono text-[13px] p-4 mb-6"
          role="alert"
        >
          <svg
            class="size-4 mt-[1px] flex-shrink-0"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
          <span x-text="banScanError"></span>
        </div>

        <!-- Ban scan summary header -->
        <template x-if="bannedPlayers.length > 0 || banScanDone">
          <div>
            <div class="flex items-center gap-4 mb-2">
              <div class="font-display text-2xl tracking-widest">BAN SCAN</div>
              <span
                class="font-mono text-[11px] bg-[#2a0a0a] text-lose border border-[#4a1a1a] px-2.5 py-0.5 rounded-sm"
                x-text="banScanNick"
              ></span>
              <div class="flex-1 h-px bg-border"></div>
            </div>

            <!-- Summary stats + load more -->
            <div
              class="bg-surface border border-border px-6 py-4 mb-6 flex flex-wrap items-center gap-x-6 gap-y-2"
            >
              <div class="flex items-center gap-2">
                <span
                  class="font-display text-[28px] leading-none text-lose"
                  x-text="filteredBannedPlayers.length"
                ></span>
                <div>
                  <div
                    class="font-mono text-[10px] tracking-[2px] uppercase text-muted"
                  >
                    banned
                  </div>
                  <div
                    class="font-mono text-[10px] tracking-[2px] uppercase text-muted"
                    x-text="filteredBannedPlayers.length === 1 ? 'opponent' : 'opponents'"
                  ></div>
                </div>
              </div>
              <div class="w-px h-8 bg-border flex-shrink-0"></div>
              <div class="font-mono text-[11px] text-muted">
                <span x-text="banScanProgress.checked"></span> players checked
                across
                <span x-text="banScanProgress.total_matches"></span> matches
              </div>
              <template x-if="banScanning">
                <div class="flex items-center gap-2">
                  <div class="w-px h-6 bg-border flex-shrink-0"></div>
                  <svg
                    class="animate-spin size-3.5 text-muted flex-shrink-0"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                  >
                    <circle
                      class="opacity-25"
                      cx="12"
                      cy="12"
                      r="10"
                      stroke="currentColor"
                      stroke-width="4"
                    />
                    <path
                      class="opacity-75"
                      fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                    />
                  </svg>
                  <span
                    class="font-mono text-[11px] text-muted"
                    x-text="banScanProgress.unique_opponents > 0 ? banScanProgress.checked + ' / ' + banScanProgress.unique_opponents + ' opponents' : 'scanning…'"
                  ></span>
                </div>
              </template>
              <template x-if="banScanHasMore && !banScanning">
                <div class="flex items-center gap-3">
                  <div class="w-px h-6 bg-border flex-shrink-0"></div>
                  <button
                    @click="loadMoreBans()"
                    class="font-mono text-[11px] tracking-[1px] uppercase text-muted border border-border px-3 py-1.5 transition-colors hover:border-brand hover:text-[#e8e8e8]"
                  >
                    SCAN MORE
                  </button>
                </div>
              </template>
              <template x-if="banScanDone && bannedPlayers.length === 0">
                <div
                  class="font-mono text-[12px] text-win flex items-center gap-2"
                >
                  <svg class="size-4" fill="currentColor" viewBox="0 0 20 20">
                    <path
                      fill-rule="evenodd"
                      d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  No banned opponents found!
                </div>
              </template>
            </div>

            <!-- Reason filter (hidden during scan to avoid Alpine x-for conflicts) -->
            <template x-if="!banScanning && availableBanReasons.length > 1">
              <div class="mb-4 flex items-center gap-2 flex-wrap">
                <span
                  class="font-mono text-[10px] tracking-[2px] uppercase text-muted w-14 flex-shrink-0"
                  >REASON</span
                >
                <template x-for="reason in availableBanReasons" :key="reason">
                  <button
                    @click="banFilterReason = reason"
                    :class="banFilterReason === reason ? 'bg-[#4a1a1a] text-lose border-lose' : 'bg-surface border-border text-muted hover:border-lose hover:text-[#e8e8e8]'"
                    class="font-mono text-[10px] tracking-[1px] uppercase border px-2.5 py-1 transition-colors"
                    x-text="banReasonLabel(reason)"
                  ></button>
                </template>
              </div>
            </template>

            <!-- Banned player cards -->
            <div class="flex flex-col gap-3 mb-6">
              <template x-for="bp in filteredBannedPlayers" :key="bp.player_id">
                <div
                  class="bg-surface border border-border overflow-hidden card-enter"
                >
                  <!-- Player header (clickable to expand) -->
                  <button
                    @click="toggleBanPlayer(bp.player_id)"
                    class="w-full px-5 py-4 flex items-center justify-between hover:bg-surface-alt transition-colors text-left"
                  >
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="min-w-0">
                        <div
                          class="font-display text-lg tracking-widest text-[#e8e8e8] truncate"
                          x-text="bp.nickname"
                        ></div>
                        <div
                          class="font-mono text-[10px] text-muted flex flex-wrap gap-x-3 gap-y-1"
                        >
                          <template
                            x-for="(ban, banIdx) in bp.bans"
                            :key="bp.player_id + '-' + banIdx"
                          >
                            <span class="flex items-center gap-1">
                              <span
                                class="text-[#b05050]"
                                x-text="fmtBanReason(ban.reason)"
                              ></span>
                              <span class="text-[#444]">·</span>
                              <span x-text="fmtBanDate(ban.starts_at)"></span>
                              <template x-if="ban.ends_at">
                                <span>
                                  <span class="text-[#444]">→</span>
                                  <span x-text="fmtBanDate(ban.ends_at)"></span>
                                </span>
                              </template>
                              <template x-if="!ban.ends_at">
                                <span class="text-lose font-medium"
                                  >PERMANENT</span
                                >
                              </template>
                            </span>
                          </template>
                        </div>
                      </div>
                    </div>
                    <div class="flex items-center gap-3 flex-shrink-0">
                      <span
                        class="font-mono text-[11px] text-muted"
                        x-text="bp.matches_against + ' match' + (bp.matches_against !== 1 ? 'es' : '')"
                      ></span>
                      <svg
                        class="size-4 text-muted transition-transform"
                        :class="banScanExpandedPlayer === bp.player_id ? 'rotate-180' : ''"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M19 9l-7 7-7-7"
                        />
                      </svg>
                    </div>
                  </button>

                  <!-- Expanded: match cards -->
                  <div
                    x-show="banScanExpandedPlayer === bp.player_id"
                    x-transition
                    class="border-t border-border"
                  >
                    <div class="px-3 py-3 flex flex-col gap-2">
                      <template x-for="m in bp.matches" :key="m.match_id">
                        <a
                          :href="m.faceit_url || '#'"
                          target="_blank"
                          rel="noopener"
                          class="bg-[#0d0d0d] border border-border px-4 py-3 grid grid-cols-[72px_1fr_auto] gap-4 items-center transition-colors hover:border-brand no-underline text-[#e8e8e8] block"
                        >
                          <div
                            class="font-mono text-[11px] text-muted leading-relaxed"
                          >
                            <span x-text="matchDate(m)[0]"></span><br />
                            <span x-text="matchDate(m)[1]"></span>
                          </div>
                          <div class="flex flex-col gap-1 min-w-0">
                            <div class="flex items-center gap-2">
                              <span
                                class="font-display text-lg tracking-widest"
                                x-text="matchMap(m)"
                              ></span>
                              <template x-if="matchIsTournament(m)">
                                <span
                                  class="font-mono text-[9px] tracking-[1px] uppercase text-gold bg-[#1a1200] border border-[#3a2800] px-1.5 py-0.5 rounded-sm truncate max-w-[200px]"
                                  x-text="'🏆 ' + matchTournamentLabel(m)"
                                ></span>
                              </template>
                            </div>
                            <div
                              class="font-mono text-[11px] text-muted truncate"
                            >
                              <template
                                x-for="(p, pi) in banMatchRoster(m)"
                                :key="p.name + pi"
                              >
                                <span>
                                  <span :class="p.cls" x-text="p.name"></span>
                                  <span
                                    x-show="pi < banMatchRoster(m).length - 1"
                                    >,
                                  </span>
                                </span>
                              </template>
                            </div>
                          </div>
                          <div class="text-right flex-shrink-0">
                            <div
                              class="font-display text-[22px] tracking-widest leading-none"
                              :class="matchScore(m).cls"
                              x-text="matchScore(m).label"
                            ></div>
                            <div
                              class="font-mono text-[10px] tracking-[1px] uppercase mt-0.5"
                              :class="matchScore(m).win === true ? 'text-win' : matchScore(m).win === false ? 'text-lose' : 'text-muted'"
                              x-text="matchScore(m).win === true ? 'win' : matchScore(m).win === false ? 'loss' : 'draw'"
                            ></div>
                          </div>
                        </a>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- ══════════════════════════════════════════════════════════════════════
           PLAYER VS PLAYER RESULTS (unchanged from original)
           ══════════════════════════════════════════════════════════════════════ -->
      <div x-show="showResults" x-transition>
        <!-- SCOREBOARD -->
        <div
          class="grid grid-cols-[1fr_auto_1fr] border border-border overflow-hidden mb-3"
        >
          <div
            class="text-center p-7 transition-colors"
            :class="youWins > oppWins ? 'bg-[#0a1a0a]' : oppWins > youWins ? 'bg-[#160a0a]' : 'bg-surface'"
          >
            <div
              class="font-display text-[clamp(18px,2.5vw,26px)] tracking-widest mb-1 break-all"
              x-text="you"
            ></div>
            <div
              class="font-display text-[clamp(44px,7vw,68px)] leading-none"
              :class="youWins > oppWins ? 'text-win' : oppWins > youWins ? 'text-lose' : 'text-brand'"

                          <span
                            class="font-mono text-[11px] w-4 text-center"
                            :class="row.delta > 2 ? 'text-win' : row.delta < -2 ? 'text-lose' : 'text-muted'"
                            x-text="row.delta > 2 ? '▲' : row.delta < -2 ? '▼' : '—'"
                          ></span>
                        </div>
                      </div>
                      <div class="grid grid-cols-2 divide-x divide-border/50">
                        <template
                          x-for="contribs in [row.f1contribs, row.f2contribs]"
                          :key="contribs === row.f1contribs ? 'f1' : 'f2'"
                        >
                          <div class="px-3 py-2">
                            <template x-for="c in contribs" :key="c.nickname">
                              <div
                                class="grid grid-cols-[16px_minmax(40px,72px)_1fr_28px_28px_42px] gap-1 items-center py-[2px]"
                                :class="c.matches < 20 ? 'opacity-40' : ''"
                              >
                                <span
                                  class="font-mono text-[8px] text-center font-medium"
                                  :style="`color:${mrLevelColor(c.level)}`"
                                  x-text="c.level || '—'"
                                ></span>
                                <span
                                  class="font-mono text-[9px] truncate"
                                  x-text="c.nickname"
                                ></span>
                                <div
                                  class="h-[3px] bg-border/50 rounded-full overflow-hidden"
                                >
                                  <div
                                    class="h-full rounded-full"
                                    :style="`width:${Math.min(c.wr,100)}%;background:${mrWrColor(c.wr)}`"
                                  ></div>
                                </div>
                                <span
                                  class="font-mono text-[9px] text-right"
                                  :style="`color:${mrWrColor(c.wr)}`"
                                  x-text="c.wr+'%'"
                                ></span>
                                <span
                                  class="font-mono text-[8px] text-right"
                                  :style="`color:${mrKdColor(c.kd)}`"
                                  x-text="c.kd ? c.kd.toFixed(2) : '—'"
                                ></span>
                                <span
                                  class="font-mono text-[8px] text-muted text-right"
                                  x-text="c.matches"
                                ></span>
                              </div>
                            </template>
                            <template x-if="contribs.length === 0"
                              ><div
                                class="font-mono text-[9px] text-muted py-1"
                              >
                                no data
                              </div></template
                            >
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
                <div
                  class="font-mono text-[10px] text-muted mt-3 tracking-wide"
                >
                  Sorted by composite score for
                  <span
                    class="text-[#e8e8e8]"
                    x-text="(mrFactions[mrFactionKeys[mrPerspective]]?.name || mrFactionKeys[mrPerspective]) + ' (Team ' + (mrPerspective === 0 ? 'A' : 'B') + ')'"
                  ></span
                  >. Score = Wilson WR × K/D factor × level. Faded = &lt;20
                  matches.
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <footer
        class="border-t border-border mt-20 py-6 text-center font-mono text-[11px] text-[#333] tracking-wide"
      >
        DIDYOUFACEIT.COM — FACEIT Data API v4 &nbsp;·&nbsp; CS2
      </footer>
    </div>
  </body>
</html>
