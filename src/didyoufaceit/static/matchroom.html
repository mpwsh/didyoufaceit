<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>didyouFACEIT — Matchroom</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"
    ></script>
    <link rel="icon" type="image/svg+xml" href="/static/icons/crosshair.svg" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script src="/static/js/shared.js"></script>
    <script src="/static/js/matchroom.js"></script>
    <script src="/static/css/tailwinds.js"></script>
  </head>
  <body
    class="bg-[#0d0d0d] text-[#e8e8e8] font-sans min-h-screen overflow-x-hidden"
    x-data="matchroomApp()"
  >
    <div class="relative z-10 max-w-5xl mx-auto px-6">
      <!-- ── Header ── -->
      <div
        class="flex items-center justify-between py-4 border-b border-border mb-8"
      >
        <a
          href="/"
          class="font-display text-2xl tracking-widest leading-none cursor-pointer hover:opacity-80 transition-opacity"
        >
          DIDYOU<svg
            class="inline-block size-[0.6em] mx-[0.1em] align-middle"
            viewBox="0 0 64 64"
            fill="#ff5500"
          >
            <rect x="28" y="8" width="8" height="18" rx="1" />
            <rect x="28" y="38" width="8" height="18" rx="1" />
            <rect x="8" y="28" width="18" height="8" rx="1" />
            <rect x="38" y="28" width="18" height="8" rx="1" /></svg
          ><span class="text-brand">FACEIT</span>
        </a>
        <div class="flex gap-2">
          <button
            x-show="mrSearching"
            @click="cancelSearch()"
            class="font-mono text-[11px] tracking-[2px] uppercase text-muted border border-border px-4 py-2 transition-colors hover:border-lose hover:text-lose"
          >
            STOP
          </button>
          <a
            href="/"
            class="font-mono text-[11px] tracking-[2px] uppercase text-muted border border-border px-4 py-2 transition-colors hover:border-brand hover:text-[#e8e8e8]"
          >
            NEW SEARCH</a
          >
        </div>
      </div>

      <!-- ── Status / Error ── -->
      <div
        x-show="mrSearching && !mrDone"
        class="font-mono text-[11px] tracking-[1.5px] text-muted mb-6 blink"
        x-text="mrStatus"
      ></div>
      <template x-if="mrError">
        <div
          class="flex gap-3 items-start bg-[#1a0a0a] border border-[#4a1a1a] text-lose font-mono text-[13px] p-4 mb-6"
          role="alert"
        >
          <svg
            class="size-4 mt-[1px] flex-shrink-0"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
          <span x-text="mrError"></span>
        </div>
      </template>

      <!-- ── MAPS: one column per team, best → worst against this opponent ── -->
      <template x-if="mrDone && mrFactionKeys.length >= 2">
        <div class="pb-8">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-6">
            <div class="flex items-center gap-3">
              <h1 class="font-display text-[24px] tracking-[3px] font-normal">
                MATCHROOM
              </h1>
              <a
                :href="mrFaceitUrl"
                target="_blank"
                rel="noopener"
                class="font-mono text-[11px] tracking-[1.5px] uppercase whitespace-nowrap text-muted border border-border px-2 py-1 hover:text-brand hover:border-brand/60 transition-colors"
                >FACEIT ↗</a
              >
              <span
                x-show="mrStatusLabel"
                class="font-mono text-[11px] tracking-[1.5px] uppercase text-lose"
                x-text="mrStatusLabel"
              ></span>
            </div>
          </div>
          <template x-if="mrScoreline">
            <div class="-mt-2 mb-5">
            <!-- Phone: one row per team, scoreboard style -->
            <div class="sm:hidden bg-surface border border-border px-3 py-2">
              <div class="font-mono text-[10px] tracking-[2px] uppercase text-muted pb-1">Final</div>
              <template x-for="t in mrScoreline" :key="t.name">
                <div class="flex items-center justify-between gap-3 py-1">
                  <span class="flex items-center gap-2 min-w-0">
                    <span
                      class="font-display text-[17px] tracking-[1.5px] truncate"
                      :class="t.won ? t.color : 'text-muted'"
                      x-text="t.name"
                    ></span>
                    <span
                      x-show="t.won"
                      class="font-mono text-[10px] tracking-[1.5px] px-1.5 py-[1px] text-win bg-win/10 shrink-0"
                      >WIN</span
                    >
                  </span>
                  <span
                    class="font-display text-[24px] tracking-[1px] leading-none"
                    :class="t.won ? '' : 'text-muted'"
                    x-text="t.score"
                  ></span>
                </div>
              </template>
              <div class="flex justify-center border-t border-border/50 mt-1 pt-1.5">
                <span x-show="mrPickedMap" class="flex items-center gap-2 font-mono text-[10px] tracking-[2px] uppercase text-muted"
                  >Picked
                  <span class="font-display text-[16px] tracking-[2px] text-brand" x-text="mrMapName(mrPickedMap)"></span
                ></span>
              </div>
            </div>
            <!-- Wider: name, score, name -->
            <div
              class="hidden sm:grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-5 bg-surface border border-border px-5 py-3"
            >
              <div class="flex items-center justify-end gap-2 min-w-0">
                <span
                  x-show="mrScoreline[0].won"
                  class="font-mono text-[10px] tracking-[1.5px] px-1.5 py-[1px] text-win bg-win/10 shrink-0"
                  >WIN</span
                >
                <span
                  class="font-display text-[20px] tracking-[1.5px] truncate"
                  :class="mrScoreline[0].won ? mrScoreline[0].color : 'text-muted'"
                  x-text="mrScoreline[0].name"
                ></span>
              </div>
              <div class="flex flex-col items-center">
                <span class="font-mono text-[10px] tracking-[2px] uppercase text-muted">Final</span>
                <span class="font-display text-[32px] tracking-[2px] leading-none whitespace-nowrap">
                  <span :class="mrScoreline[0].won ? '' : 'text-muted'" x-text="mrScoreline[0].score"></span
                  ><span class="text-muted mx-1.5">:</span
                  ><span :class="mrScoreline[1].won ? '' : 'text-muted'" x-text="mrScoreline[1].score"></span>
                </span>
                <span class="mt-1.5">
                <span x-show="mrPickedMap" class="flex items-center gap-2 font-mono text-[10px] tracking-[2px] uppercase text-muted"
                  >Picked
                  <span class="font-display text-[16px] tracking-[2px] text-brand" x-text="mrMapName(mrPickedMap)"></span
                ></span>
                </span>
              </div>
              <div class="flex items-center gap-2 min-w-0">
                <span
                  class="font-display text-[20px] tracking-[1.5px] truncate"
                  :class="mrScoreline[1].won ? mrScoreline[1].color : 'text-muted'"
                  x-text="mrScoreline[1].name"
                ></span>
                <span
                  x-show="mrScoreline[1].won"
                  class="font-mono text-[10px] tracking-[1.5px] px-1.5 py-[1px] text-win bg-win/10 shrink-0"
                  >WIN</span
                >
              </div>
            </div>
            </div>
          </template>
          <div x-show="!mrScoreline && mrPickedMap" class="flex justify-center -mt-2 mb-5">
            <span class="flex items-center gap-2 bg-surface border border-border px-4 py-2">
              <span class="font-mono text-[11px] tracking-[2px] uppercase text-muted">Picked</span>
              <span class="font-display text-[20px] tracking-[2px] text-brand" x-text="mrMapName(mrPickedMap)"></span>
            </span>
          </div>
          <p
            x-show="mrPoolNote"
            class="font-mono text-[11px] leading-relaxed text-gold border border-gold/30 bg-gold/5 px-3 py-2 -mt-3 mb-5"
            x-text="mrPoolNote"
          ></p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <template x-for="idx in [0, 1]" :key="idx">
              <section class="bg-surface border border-border p-3 sm:p-4">
                <div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1 mb-3">
                  <h2
                    class="font-display text-[20px] tracking-[2px] font-normal truncate"
                    :class="idx === 0 ? 'text-brand' : 'text-blue'"
                    x-text="mrTeamName(idx)"
                  ></h2>
                </div>
                <div
                  class="flex items-center gap-1.5 sm:gap-2 px-2 pb-1 font-mono text-[10px] tracking-[1px] uppercase text-muted"
                >
                  <span class="hidden sm:block w-4 shrink-0">#</span
                  ><span class="flex-1 min-w-0">Map</span
                  ><span class="w-9 sm:w-12 shrink-0 text-right">Rating</span
                  ><span class="w-10 sm:w-12 shrink-0 text-right">Win %</span
                  ><span class="w-12 sm:w-16 shrink-0 text-right">Matches</span>
                </div>
                <div class="flex flex-col gap-1">
                  <template x-for="row in mrColumn(idx)" :key="row.id">
                    <button
                      type="button"
                      @click="mrSelect(row.id)"
                      :aria-pressed="mrSel === row.id"
                      class="w-full flex gap-1.5 sm:gap-2 items-center min-h-[44px] px-2 text-left border transition-colors"
                      :class="mrSel === row.id ? (idx === 0 ? 'border-brand/60 bg-surface-alt' : 'border-blue/60 bg-surface-alt') : 'border-transparent hover:bg-surface-alt'"
                    >
                      <span
                        class="hidden sm:block w-4 shrink-0 font-mono text-[12px] text-muted"
                        x-text="row.rank"
                      ></span>
                      <span
                        class="flex-1 min-w-0 font-display text-[16px] sm:text-[19px] tracking-[1px] sm:tracking-[1.5px] truncate"
                        :class="row.wr === null || row.lowConf ? 'text-muted' : ''"
                        :title="row.lowConf ? 'Too few matches on this map to trust the win %' : ''"
                        x-text="mrMapName(row.id)"
                      ></span>
                      <span
                        class="w-9 sm:w-12 shrink-0 font-mono text-[13px] text-right"
                        :style="row.ratingColor && `color:${row.ratingColor}`"
                        x-text="row.rating"
                      ></span>
                      <span
                        class="w-10 sm:w-12 shrink-0 font-mono text-[13px] text-right"
                        :class="row.lowConf ? 'opacity-40' : ''"
                        :style="row.winColor && `color:${row.winColor}`"
                        x-text="row.winPct"
                      ></span>
                      <span
                        class="w-12 sm:w-16 shrink-0 font-mono text-[12px] text-right"
                        :class="row.lowData ? 'text-muted' : 'text-[#a3a3a3]'"
                        :title="row.lowData ? 'Fewer than 3 players have played this map' : ''"
                        x-text="row.matches"
                      ></span>
                    </button>
                  </template>
                </div>
              </section>
            </template>
          </div>

          <!-- Players on the selected map, grouped by team -->
          <section
            x-show="mrSel"
            class="bg-surface border border-border p-3 sm:p-4 mt-4"
          >
            <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
              <h2 class="font-display text-[20px] tracking-[2px] font-normal">
                <span x-text="mrMapName(mrSel)"></span> · players
              </h2>
              <span
                class="font-mono text-[11px] text-muted"
                x-text="mrSelSummary"
              ></span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
              <template x-for="team in mrSelTeams" :key="team.key">
                <div class="min-w-0">
                  <div
                    class="flex flex-col gap-1 px-2 pb-2 mb-1 border-b border-border"
                  >
                    <span class="flex items-center gap-2 min-w-0">
                      <span class="size-2 shrink-0" :class="team.dot"></span>
                      <span
                        class="font-display text-[17px] tracking-[1.5px] truncate"
                        :class="team.color"
                        x-text="team.name"
                      ></span>
                    </span>
                    <span class="flex items-center gap-3 font-mono text-[11px] text-muted">
                      <span
                        >Rating
                        <span
                          class="text-[12px]"
                          :style="team.ratingColor && `color:${team.ratingColor}`"
                          x-text="team.rating"
                        ></span
                      ></span>
                      <span class="hidden sm:inline"
                        >Win %
                        <span
                          class="text-[12px]"
                          :style="team.winColor && `color:${team.winColor}`"
                          x-text="team.winPct"
                        ></span
                      ></span>
                      <span
                        class="text-[12px] px-2 py-[2px] rounded-full whitespace-nowrap"
                        :class="diffClass(team.diff)"
                        x-text="fmtDiff(team.diff)"
                      ></span>
                    </span>
                  </div>
                  <div
                    class="grid grid-cols-[20px_minmax(0,1fr)_38px] sm:grid-cols-[18px_minmax(0,1fr)_36px_34px_38px_46px] gap-1.5 px-2 pb-1 font-mono text-[10px] tracking-[0.5px] uppercase text-muted"
                  >
                    <span>LVL</span><span>Player</span
                    ><span class="hidden sm:block text-right">Win %</span
                    ><span class="hidden sm:block text-right">K/D</span
                    ><span class="text-right">Rating</span
                    ><span class="hidden sm:block text-right">Matches</span>
                  </div>
                  <template x-for="p in team.players" :key="p.key">
                    <div
                      class="grid grid-cols-[20px_minmax(0,1fr)_38px] sm:grid-cols-[18px_minmax(0,1fr)_36px_34px_38px_46px] gap-1.5 items-center min-h-[34px] px-2 border-t border-border/50 font-mono text-[12px]"
                      :class="p.matches < 20 ? 'opacity-40' : ''"
                    >
                      <span
                        class="font-medium"
                        :style="`color:${levelColor(p.level)}`"
                        x-text="p.level || '—'"
                      ></span>
                      <span class="flex items-center gap-1.5 min-w-0">
                        <span class="flex-1 min-w-0 font-sans text-[13px] truncate" :title="p.nickname" x-text="p.nickname"></span>
                        <span class="flex items-center gap-0.5 shrink-0">
                          <a
                            :href="p.faceitUrl"
                            target="_blank"
                            rel="noopener"
                            class="profile-btn profile-btn--faceit size-4 flex items-center justify-center border border-border rounded-sm transition-colors"
                            title="FACEIT profile"
                            :aria-label="p.nickname + ' on FACEIT'"
                          >
                            <img src="/static/icons/faceit.svg" class="size-2.5 profile-icon" alt="" />
                          </a>
                          <template x-if="p.steamUrl">
                            <a
                              :href="p.steamUrl"
                              target="_blank"
                              rel="noopener"
                              class="profile-btn profile-btn--steam size-4 flex items-center justify-center border border-border rounded-sm transition-colors"
                              title="Steam profile"
                              :aria-label="p.nickname + ' on Steam'"
                            >
                              <img src="/static/icons/steam.svg" class="size-2.5 profile-icon" alt="" />
                            </a>
                          </template>
                          <template x-if="p.ripUrl">
                            <a
                              :href="p.ripUrl"
                              target="_blank"
                              rel="noopener"
                              class="profile-btn profile-btn--rip size-4 flex items-center justify-center border border-border rounded-sm transition-colors"
                              title="Steam .rip profile"
                              :aria-label="p.nickname + ' on steamcommunity.rip'"
                            >
                              <img src="/static/icons/stats.svg" class="size-2.5 profile-icon" alt="" />
                            </a>
                          </template>
                        </span>
                      </span>
                      <span
                        class="hidden sm:block text-right"
                        :style="p.winPct !== null && `color:${wrColor(p.winPct)}`"
                        x-text="p.winPct === null ? '—' : p.winPct + '%'"
                      ></span>
                      <span
                        class="hidden sm:block text-right"
                        :style="p.kd !== null && `color:${kdColor(p.kd)}`"
                        x-text="p.kd === null ? '—' : p.kd.toFixed(2)"
                      ></span>
                      <span
                        class="text-right"
                        :style="p.rating !== null && `color:${ratingColor(p.rating)}`"
                        x-text="p.rating === null ? '—' : p.rating.toFixed(2)"
                      ></span>
                      <span class="hidden sm:block text-right text-[#a3a3a3]" x-text="p.matches"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </section>

          <p class="font-mono text-[11px] text-muted mt-4 tracking-wide leading-relaxed">
            Maps are ordered by Win %: the lifetime wins of the players who have
            played the map over their matches, which is the Matches column. Maps
            under 20 matches go to the bottom, unranked. Rating is the mean of the
            five players, each approximating HLTV 2.0 from their last 100 matches and
            pulled toward their overall form on maps they rarely play; a player with no
            games on a map counts at their overall rating. The ± pill on a selected map
            is that team's rating minus the other team's. Faded players: fewer than 20
            matches on the map.
          </p>
        </div>
      </template>

      <footer
        class="border-t border-border mt-20 py-8 text-center font-mono text-[11px] text-[#444] tracking-wide space-y-2"
      >
        <div>
          DIDYOUFACEIT.COM &nbsp;·&nbsp; Powered by the
          <a
            href="https://docs.faceit.com/docs/data-api/data/"
            target="_blank"
            rel="noopener"
            class="text-[#555] hover:text-brand transition-colors"
            >FACEIT Data API v4</a
          >
          &nbsp;·&nbsp; CS2
        </div>
        <div class="text-[10px] text-[#333]">
          Not affiliated with or endorsed by FACEIT or Valve. FACEIT is a
          trademark of ESL FACEIT Group. Counter-Strike 2 is a trademark of
          Valve Corporation.
        </div>
      </footer>
    </div>
  </body>
</html>
