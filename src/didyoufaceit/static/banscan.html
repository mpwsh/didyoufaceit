<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>didyouFACEIT — Ban Scan</title>
    <link rel="icon" type="image/svg+xml" href="/static/crosshair.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.8/dist/cdn.min.js"
    ></script>
    <script src="/static/shared.js"></script>
    <script src="/static/banscan.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: { DEFAULT: "#ff5500", dim: "#cc4400" },
              surface: { DEFAULT: "#141414", alt: "#1a1a1a" },
              border: { DEFAULT: "#2a2a2a", strong: "#3a3a3a" },
              win: "#22c55e",
              lose: "#ef4444",
              muted: "#666666",
              blue: "#60a5fa",
              gold: "#f59e0b",
            },
            fontFamily: {
              display: ['"Bebas Neue"', "sans-serif"],
              mono: ['"DM Mono"', "monospace"],
              sans: ['"DM Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 85, 0, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 85, 0, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes indeterminate {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(420%);
        }
      }
      .progress-indeterminate {
        animation: indeterminate 1.4s ease-in-out infinite;
      }
      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card-enter {
        animation: fadeSlide 0.22s ease both;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 0.8;
        }
      }
      .blink {
        animation: blink 1.4s ease-in-out infinite;
      }
      /* Hover lift for secondary cards */
      .search-card {
        transition:
          border-color 0.2s ease,
          transform 0.15s ease;
      }
      .search-card:hover {
        transform: translateY(-1px);
      }
      /* Subtle label line accent */
      .card-label {
        position: relative;
      }
      .card-label::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 0;
        height: 1px;
        width: 24px;
        background: currentColor;
        opacity: 0.4;
      }
      /* Profile link icons — use CSS filter to recolor black SVGs */
      .profile-icon {
        filter: brightness(0) invert(0.4); /* muted gray */
        transition: filter 0.2s ease;
      }
      .profile-btn--faceit:hover {
        border-color: #ff5500 !important;
      }
      .profile-btn--faceit:hover .profile-icon {
        filter: brightness(0) invert(0.55) sepia(1) saturate(20)
          hue-rotate(3deg); /* brand orange */
      }
      .profile-btn--steam:hover {
        border-color: #66c0f4 !important;
      }
      .profile-btn--steam:hover .profile-icon {
        filter: brightness(0) invert(0.75) sepia(1) saturate(3)
          hue-rotate(175deg); /* steam blue */
      }
      .profile-btn--rip:hover {
        border-color: #ef4444 !important;
      }
      .profile-btn--rip:hover .profile-icon {
        filter: brightness(0) invert(0.55) sepia(1) saturate(20)
          hue-rotate(340deg); /* red */
      }
    </style>
  </head>
  <body
    class="bg-[#0d0d0d] text-[#e8e8e8] font-sans min-h-screen overflow-x-hidden"
    x-data="banscanApp()"
    x-init="init()"
  >
    <div class="relative z-10 max-w-4xl mx-auto px-6">

      <!-- ── Header ── -->
      <div class="flex items-center justify-between py-4 border-b border-border mb-8">
        <a href="/" class="font-display text-2xl tracking-widest leading-none cursor-pointer hover:opacity-80 transition-opacity">
          DIDYOU<svg class="inline-block size-[0.6em] mx-[0.1em] align-middle" viewBox="0 0 64 64" fill="#ff5500"><rect x="28" y="8" width="8" height="18" rx="1"/><rect x="28" y="38" width="8" height="18" rx="1"/><rect x="8" y="28" width="18" height="8" rx="1"/><rect x="38" y="28" width="18" height="8" rx="1"/></svg><span class="text-brand">FACEIT</span>
        </a>
        <div class="flex gap-2">
          <button
            x-show="banScanning"
            @click="cancelSearch()"
            class="font-mono text-[11px] tracking-[2px] uppercase text-muted border border-border px-4 py-2 transition-colors hover:border-lose hover:text-lose"
          >STOP</button>
          <a href="/" class="font-mono text-[11px] tracking-[2px] uppercase text-muted border border-border px-4 py-2 transition-colors hover:border-brand hover:text-[#e8e8e8]">NEW SEARCH</a>
        </div>
      </div>
      <!-- ── ERROR ── -->
      <div
        x-show="errorMsg"
        x-transition
        class="flex gap-3 items-start bg-[#1a0a0a] border border-[#4a1a1a] text-lose font-mono text-[13px] p-4 mb-6"
        role="alert"
      >
        <svg
          class="size-4 mt-[1px] flex-shrink-0"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd"
          />
        </svg>
        <span x-text="errorMsg"></span>
      </div>
      <!-- ══════════════════════════════════════════════════════════════════════
           BAN SCAN RESULTS
           ══════════════════════════════════════════════════════════════════════ -->
      <div x-show="showBanResults || banScanning" x-transition>
        <!-- Ban scan progress bar (only on initial scan, not load-more) -->
        <div
          x-show="banScanning && !banScanDone && bannedPlayers.length === 0"
          x-transition
          class="mb-8"
        >
          <div class="flex justify-between items-end mb-2">
            <span
              class="font-mono text-[11px] tracking-[1.5px] uppercase text-muted"
              x-text="banScanProgress.unique_opponents > 0 ? 'Checking opponents for bans…' : 'Fetching match history…'"
            ></span>
            <span
              class="font-mono text-[11px] text-lose"
              x-text="(bannedPlayers.length || 0) > 0 ? bannedPlayers.length + ' banned' : ''"
            ></span>
          </div>
          <div class="h-[3px] bg-border overflow-hidden" role="progressbar">
            <div
              class="h-full bg-lose transition-[width] duration-300"
              :class="!banScanProgress.unique_opponents ? 'progress-indeterminate w-[30%]' : ''"
              :style="banScanProgress.unique_opponents > 0 ? `width: ${Math.round((banScanProgress.checked / banScanProgress.unique_opponents) * 100)}%` : ''"
            ></div>
          </div>
          <div class="flex gap-6 mt-2 font-mono text-[11px] text-muted">
            <span
              x-text="banScanProgress.unique_opponents > 0 ? banScanProgress.checked + ' / ' + banScanProgress.unique_opponents + ' opponents checked' : 'scanning…'"
            ></span>
            <span
              x-show="banScanProgress.total_matches > 0"
              x-text="banScanProgress.total_matches + ' matches'"
            ></span>
          </div>
        </div>

        <!-- Ban scan error -->
        <div
          x-show="banScanError"
          x-transition
          class="flex gap-3 items-start bg-[#1a0a0a] border border-[#4a1a1a] text-lose font-mono text-[13px] p-4 mb-6"
          role="alert"
        >
          <svg
            class="size-4 mt-[1px] flex-shrink-0"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
          <span x-text="banScanError"></span>
        </div>

        <!-- Ban scan summary header -->
        <template x-if="bannedPlayers.length > 0 || banScanDone">
          <div>
            <div class="flex items-center gap-4 mb-2">
              <div class="font-display text-2xl tracking-widest">BAN SCAN</div>
              <span
                class="font-mono text-[11px] bg-[#2a0a0a] text-lose border border-[#4a1a1a] px-2.5 py-0.5 rounded-sm"
                x-text="banScanNick"
              ></span>
              <div class="flex-1 h-px bg-border"></div>
            </div>

            <!-- Summary stats + load more -->
            <div
              class="bg-surface border border-border px-6 py-4 mb-6 flex flex-wrap items-center gap-x-6 gap-y-2"
            >
              <div class="flex items-center gap-2">
                <span
                  class="font-display text-[28px] leading-none text-lose"
                  x-text="filteredBannedPlayers.length"
                ></span>
                <div>
                  <div
                    class="font-mono text-[10px] tracking-[2px] uppercase text-muted"
                  >
                    banned
                  </div>
                  <div
                    class="font-mono text-[10px] tracking-[2px] uppercase text-muted"
                    x-text="filteredBannedPlayers.length === 1 ? 'opponent' : 'opponents'"
                  ></div>
                </div>
              </div>
              <div class="w-px h-8 bg-border flex-shrink-0"></div>
              <div class="font-mono text-[11px] text-muted">
                <span x-text="banScanProgress.checked"></span> players checked
                across
                <span x-text="banScanProgress.total_matches"></span> matches
              </div>
              <template x-if="banScanning">
                <div class="flex items-center gap-2">
                  <div class="w-px h-6 bg-border flex-shrink-0"></div>
                  <svg
                    class="animate-spin size-3.5 text-muted flex-shrink-0"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                  >
                    <circle
                      class="opacity-25"
                      cx="12"
                      cy="12"
                      r="10"
                      stroke="currentColor"
                      stroke-width="4"
                    />
                    <path
                      class="opacity-75"
                      fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                    />
                  </svg>
                  <span
                    class="font-mono text-[11px] text-muted"
                    x-text="banScanProgress.unique_opponents > 0 ? banScanProgress.checked + ' / ' + banScanProgress.unique_opponents + ' opponents' : 'scanning…'"
                  ></span>
                </div>
              </template>
              <template x-if="banScanHasMore && !banScanning">
                <div class="flex items-center gap-3">
                  <div class="w-px h-6 bg-border flex-shrink-0"></div>
                  <button
                    @click="loadMoreBans()"
                    class="font-mono text-[11px] tracking-[2px] uppercase text-lose border border-lose/60 px-4 py-1.5 transition-all hover:bg-[#2a0a0a] hover:border-lose hover:text-lose"
                  >
                    SCAN MORE
                  </button>
                </div>
              </template>
              <template x-if="banScanDone && bannedPlayers.length === 0">
                <div
                  class="font-mono text-[12px] text-win flex items-center gap-2"
                >
                  <svg class="size-4" fill="currentColor" viewBox="0 0 20 20">
                    <path
                      fill-rule="evenodd"
                      d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  No banned opponents found!
                </div>
              </template>
            </div>

            <!-- Reason filter (hidden during scan to avoid Alpine x-for conflicts) -->
            <template x-if="!banScanning && availableBanReasons.length > 1">
              <div class="mb-4 flex items-center gap-2 flex-wrap">
                <span
                  class="font-mono text-[10px] tracking-[2px] uppercase text-muted w-14 flex-shrink-0"
                  >REASON</span
                >
                <template x-for="reason in availableBanReasons" :key="reason">
                  <button
                    @click="banFilterReason = reason"
                    :class="banFilterReason === reason ? 'bg-[#4a1a1a] text-lose border-lose' : 'bg-surface border-border text-muted hover:border-lose hover:text-[#e8e8e8]'"
                    class="font-mono text-[10px] tracking-[1px] uppercase border px-2.5 py-1 transition-colors"
                    x-text="banReasonLabel(reason)"
                  ></button>
                </template>
              </div>
            </template>

            <!-- Banned player cards -->
            <div class="flex flex-col gap-3 mb-6">
              <template x-for="bp in filteredBannedPlayers" :key="bp.player_id">
                <div
                  class="bg-surface border border-border overflow-hidden card-enter"
                >
                  <!-- Player header (clickable to expand) -->
                  <button
                    @click="toggleBanPlayer(bp.player_id)"
                    class="w-full px-5 py-4 flex items-center justify-between hover:bg-surface-alt transition-colors text-left"
                  >
                    <div class="flex items-center gap-3 min-w-0">
                      <!-- Avatar -->
                      <div
                        class="size-10 flex-shrink-0 bg-[#0d0d0d] border border-border/60 rounded overflow-hidden"
                      >
                        <template x-if="bp.avatar">
                          <img
                            :src="bp.avatar"
                            :alt="bp.nickname"
                            class="size-full object-cover"
                            loading="lazy"
                          />
                        </template>
                        <template x-if="!bp.avatar">
                          <div
                            class="size-full flex items-center justify-center text-muted font-display text-sm"
                            x-text="bp.nickname.charAt(0).toUpperCase()"
                          ></div>
                        </template>
                      </div>
                      <div class="min-w-0">
                        <!-- Nickname + profile buttons on same line -->
                        <div class="flex items-center gap-2">
                          <div
                            class="font-display text-lg tracking-widest text-[#e8e8e8] truncate"
                            x-text="bp.nickname"
                          ></div>
                          <!-- Profile links -->
                          <div
                            class="flex items-center gap-1 flex-shrink-0"
                            @click.stop
                          >
                            <!-- FACEIT profile -->
                            <a
                              :href="'https://www.faceit.com/en/players/' + bp.nickname"
                              target="_blank"
                              rel="noopener"
                              class="profile-btn profile-btn--faceit size-5 flex items-center justify-center border border-border rounded-sm transition-colors"
                              title="FACEIT Profile"
                            >
                              <img
                                src="/static/faceit.svg"
                                class="size-2.5 profile-icon"
                                alt="F"
                              />
                            </a>
                            <!-- Steam profile -->
                            <template x-if="bp.steam_id_64">
                              <a
                                :href="'https://steamcommunity.com/profiles/' + bp.steam_id_64"
                                target="_blank"
                                rel="noopener"
                                class="profile-btn profile-btn--steam size-5 flex items-center justify-center border border-border rounded-sm transition-colors"
                                title="Steam Profile"
                              >
                                <img
                                  src="/static/steam.svg"
                                  class="size-2.5 profile-icon"
                                  alt="S"
                                />
                              </a>
                            </template>
                            <!-- Steam .rip profile -->
                            <template x-if="bp.steam_id_64">
                              <a
                                :href="'https://steamcommunity.rip/profiles/' + bp.steam_id_64"
                                target="_blank"
                                rel="noopener"
                                class="profile-btn profile-btn--rip size-5 flex items-center justify-center border border-border rounded-sm transition-colors"
                                title="Steam .rip Profile"
                              >
                                <img
                                  src="/static/stats.svg"
                                  class="size-2.5 profile-icon"
                                  alt="R"
                                />
                              </a>
                            </template>
                          </div>
                        </div>
                        <!-- Ban info -->
                        <div
                          class="font-mono text-[10px] text-muted flex flex-wrap gap-x-3 gap-y-1"
                        >
                          <template
                            x-for="(ban, banIdx) in bp.bans"
                            :key="bp.player_id + '-' + banIdx"
                          >
                            <span class="flex items-center gap-1">
                              <span
                                class="text-[#b05050]"
                                x-text="fmtBanReason(ban.reason)"
                              ></span>
                              <span class="text-[#444]">·</span>
                              <span x-text="fmtBanDate(ban.starts_at)"></span>
                              <template x-if="ban.ends_at">
                                <span>
                                  <span class="text-[#444]">→</span>
                                  <span x-text="fmtBanDate(ban.ends_at)"></span>
                                </span>
                              </template>
                              <template x-if="!ban.ends_at">
                                <span class="text-lose font-medium"
                                  >PERMANENT</span
                                >
                              </template>
                            </span>
                          </template>
                        </div>
                      </div>
                    </div>
                    <div class="flex items-center gap-3 flex-shrink-0">
                      <span
                        class="font-mono text-[11px] text-muted"
                        x-text="bp.matches_against + ' match' + (bp.matches_against !== 1 ? 'es' : '')"
                      ></span>
                      <svg
                        class="size-4 text-muted transition-transform"
                        :class="banScanExpandedPlayer === bp.player_id ? 'rotate-180' : ''"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M19 9l-7 7-7-7"
                        />
                      </svg>
                    </div>
                  </button>

                  <!-- Expanded: match cards -->
                  <div
                    x-show="banScanExpandedPlayer === bp.player_id"
                    x-transition
                    class="border-t border-border"
                  >
                    <div class="px-3 py-3 flex flex-col gap-2">
                      <template x-for="m in bp.matches" :key="m.match_id">
                        <a
                          :href="m.faceit_url || '#'"
                          target="_blank"
                          rel="noopener"
                          class="bg-[#0d0d0d] border border-border px-4 py-3 grid grid-cols-[72px_1fr_auto] gap-4 items-center transition-colors hover:border-brand no-underline text-[#e8e8e8] block"
                        >
                          <div
                            class="font-mono text-[11px] text-muted leading-relaxed"
                          >
                            <span x-text="matchDate(m)[0]"></span><br />
                            <span x-text="matchDate(m)[1]"></span>
                          </div>
                          <div class="flex flex-col gap-1 min-w-0">
                            <div class="flex items-center gap-2">
                              <span
                                class="font-display text-lg tracking-widest"
                                x-text="matchMap(m)"
                              ></span>
                              <template x-if="matchIsTournament(m)">
                                <span
                                  class="font-mono text-[9px] tracking-[1px] uppercase text-gold bg-[#1a1200] border border-[#3a2800] px-1.5 py-0.5 rounded-sm truncate max-w-[200px]"
                                  x-text="'🏆 ' + matchTournamentLabel(m)"
                                ></span>
                              </template>
                            </div>
                            <div
                              class="font-mono text-[11px] text-muted truncate"
                            >
                              <template
                                x-for="(p, pi) in banMatchRoster(m)"
                                :key="p.name + pi"
                              >
                                <span>
                                  <span :class="p.cls" x-text="p.name"></span>
                                  <span
                                    x-show="pi < banMatchRoster(m).length - 1"
                                    >,
                                  </span>
                                </span>
                              </template>
                            </div>
                          </div>
                          <div class="text-right flex-shrink-0">
                            <div
                              class="font-display text-[22px] tracking-widest leading-none"
                              :class="matchScore(m).cls"
                              x-text="matchScore(m).label"
                            ></div>
                            <div
                              class="font-mono text-[10px] tracking-[1px] uppercase mt-0.5"
                              :class="matchScore(m).win === true ? 'text-win' : matchScore(m).win === false ? 'text-lose' : 'text-muted'"
                              x-text="matchScore(m).win === true ? 'win' : matchScore(m).win === false ? 'loss' : 'draw'"
                            ></div>
                          </div>
                        </a>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <footer
        class="border-t border-border mt-20 py-8 text-center font-mono text-[11px] text-[#444] tracking-wide space-y-2"
      >
        <div>
          DIDYOUFACEIT.COM &nbsp;·&nbsp; Powered by the
          <a
            href="https://docs.faceit.com/docs/data-api/data/"
            target="_blank"
            rel="noopener"
            class="text-[#555] hover:text-brand transition-colors"
            >FACEIT Data API v4</a
          >
          &nbsp;·&nbsp; CS2
        </div>
        <div class="text-[10px] text-[#333]">
          Not affiliated with or endorsed by FACEIT or Valve. FACEIT is a
          trademark of ESL FACEIT Group. Counter-Strike 2 is a trademark of
          Valve Corporation.
        </div>
      </footer>
    </div>
  </body>
