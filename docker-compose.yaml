services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: didyou
      POSTGRES_PASSWORD: didyou
      POSTGRES_DB: didyou
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U didyou"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${PORT:-5001}:5000"
    environment:
      DATABASE_URL: postgresql://didyou:didyou@db:5432/didyou
      FACEIT_API_KEY: ${FACEIT_API_KEY}
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
