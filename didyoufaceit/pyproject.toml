[project]
name = "faceit-finder"
version = "0.2.0"
requires-python = ">=3.12"
description = "CS2 FACEIT match history & matchroom analyzer"
dependencies = [
  "fastapi~=0.115.6",
  "uvicorn[standard]~=0.34.0",
  "gunicorn~=23.0.0",
  "httpx~=0.28.0",
  "aiosqlite~=0.20.0",
  "python-dotenv~=1.0.0",
  "click~=8.1.7",
  "rich~=13.9.0",
]

[project.scripts]
faceit-finder-web = "faceit_finder.server:run"
faceit-finder = "faceit_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/faceit_finder"]

[tool.uv]
dev-dependencies = [
  "pytest~=8.0.0",
  "pytest-asyncio~=0.24.0",
  "ruff~=0.11.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
